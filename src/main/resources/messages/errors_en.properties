# Error code -> text shown to the customer (English). Keys = ErrorCodes.
REQUEST_REJECTED=The request was rejected
IDENTITY_CONFLICT=The customer or user name is linked to another identity
CUSTOMER_PROFILE_INCOMPLETE=The customer profile does not allow account creation
ACCOUNT_CREATION_UNAVAILABLE=Authentication account creation could not be completed
INVALID_CREDENTIALS=The user name or password is incorrect
ACCOUNT_NOT_READY=The account is not ready to log in
LOGIN_UNAVAILABLE=Login is not available right now, please try again later
SESSION_REQUIRED=The session is invalid or has expired
SESSION_GONE=The session no longer exists
SESSION_CONFLICT=The session was just updated, please try again
INTERNAL_ERROR=The request could not be processed
TEMPORARILY_UNAVAILABLE=Please try again later
