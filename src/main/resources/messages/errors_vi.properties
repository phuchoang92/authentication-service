# Error code -> text shown to the customer (Vietnamese, default language). Keys = ErrorCodes.
REQUEST_REJECTED=Yêu cầu không hợp lệ
IDENTITY_CONFLICT=Khách hàng hoặc tên đăng nhập đã được liên kết với một tài khoản khác
CUSTOMER_PROFILE_INCOMPLETE=Hồ sơ khách hàng chưa đủ điều kiện để tạo tài khoản
ACCOUNT_CREATION_UNAVAILABLE=Không thể hoàn tất việc tạo tài khoản lúc này
INVALID_CREDENTIALS=Tên đăng nhập hoặc mật khẩu không đúng
ACCOUNT_NOT_READY=Tài khoản chưa sẵn sàng để đăng nhập
ACCOUNT_LOCKED=Tài khoản đã bị tạm khóa do đăng nhập sai nhiều lần
CAPTCHA_REQUIRED=Vui lòng nhập mã xác nhận để tiếp tục
LOGIN_UNAVAILABLE=Không thể đăng nhập lúc này, vui lòng thử lại sau
SESSION_REQUIRED=Phiên đăng nhập không hợp lệ hoặc đã hết hạn
SESSION_GONE=Phiên đăng nhập không còn tồn tại
SESSION_CONFLICT=Phiên đăng nhập vừa được cập nhật, vui lòng thử lại
CUSTOMER_UNKNOWN=Không tìm thấy khách hàng
INTERNAL_ERROR=Yêu cầu không thể được xử lý
TEMPORARILY_UNAVAILABLE=Vui lòng thử lại sau
