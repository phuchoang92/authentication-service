spring:
  application:
    name: authentication-service
  data:
    redis:
      url: ${AUTH_VALKEY_URL:redis://localhost:6379}
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USER}
    password: ${AUTH_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
      naming:
        # Table and column names are used exactly as written in the entities (upper case, like the DDL).
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

auth:
  registration:
    # Off by default: the caller is not authenticated yet; enable only on internal integration.
    enabled: ${AUTH_REGISTRATION_ENABLED:false}
    request-digest-key-base64: ${AUTH_REGISTRATION_DIGEST_KEY_BASE64:}
    customer:
      origin: ${AUTH_CUSTOMER_ORIGIN:}
      service-token: ${AUTH_CUSTOMER_SERVICE_TOKEN:}
    keycloak:
      base-url: ${AUTH_KC_BASE_URL:}
      realm: ${AUTH_KC_REALM:}
      admin-client-id: ${AUTH_KC_ADMIN_CLIENT_ID:}
      admin-client-secret: ${AUTH_KC_ADMIN_CLIENT_SECRET:}
    notification:
      origin: ${AUTH_NOTIFICATION_ORIGIN:}
      service-token: ${AUTH_NOTIFICATION_SERVICE_TOKEN:}
  login:
    # Off by default: no caller authentication yet on /api/ns and /internal.
    enabled: ${AUTH_LOGIN_ENABLED:false}
    keycloak:
      base-url: ${AUTH_KC_BASE_URL:}
      realm: ${AUTH_KC_REALM:}
      client-id: ${AUTH_KC_LOGIN_CLIENT_ID:authentication-service}
      client-secret: ${AUTH_KC_LOGIN_CLIENT_SECRET:}
  session:
    idle: PT15M
    absolute: PT20M
    max-admitted-at-skew: PT30S
  captcha:
    answer-hmac-key-base64: ${AUTH_CAPTCHA_ANSWER_HMAC_KEY_BASE64:}
  device:
    lookup-key-id: ${AUTH_DEVICE_LOOKUP_KEY_ID:d1}
    lookup-hmac-keys-base64:
      d1: ${AUTH_DEVICE_LOOKUP_HMAC_KEY_D1_BASE64:}
    encryption-key-id: ${AUTH_DEVICE_ENCRYPTION_KEY_ID:e1}
    encryption-keys-base64:
      e1: ${AUTH_DEVICE_ENCRYPTION_KEY_E1_BASE64:}
    trust-duration: P180D
    max-live-devices: 5
    restricted-session-ttl: PT10M
  audit:
    # Security activity audit (SECURITY_AUDIT_EVENT): login outcomes, written by one background thread,
    # best-effort (dropped under overload). Off by default.
    enabled: ${AUTH_AUDIT_ENABLED:false}
    queue-capacity: 10000
    batch-size: 100
    shutdown-drain: PT2S
  bff:
    # Slice 11: the BFF admits the app's session and calls the trusted-device routes with a signed assertion
    # (ES256, typ bff-assertion+jwt). The pinned public JWK must carry its kid. No default.
    assertion-issuer: ${AUTH_BFF_ASSERTION_ISSUER:mobile-bff}
    assertion-public-jwk: ${AUTH_BFF_ASSERTION_PUBLIC_JWK:}
  service-token:
    # Slice 12: a scoped JWT for flows without a customer session (onboarding), issued to an internal service
    # that presents a client assertion (ES256, typ service-client-assertion+jwt) signed with its pinned key.
    # The lifetime is policy: no default, 1 to 30 minutes. Off by default.
    enabled: ${AUTH_SERVICE_TOKEN_ENABLED:false}
    issuer: ${AUTH_SERVICE_TOKEN_ISSUER:authentication-service}
    audience: ${AUTH_SERVICE_TOKEN_AUDIENCE:mobile-bff}
    lifetime: ${AUTH_SERVICE_TOKEN_LIFETIME:}
    # Private P-256 JWK (with kid) that signs the tokens; its public half is served at GET /internal/v1/service-tokens/jwks.
    signing-private-jwk: ${AUTH_SERVICE_TOKEN_SIGNING_PRIVATE_JWK:}
    # One entry per calling service: its pinned public P-256 JWK (with kid) and the scopes it may ask for.
    callers:
      onboarding-service:
        public-jwk: ${AUTH_SERVICE_TOKEN_ONBOARDING_PUBLIC_JWK:}
        scopes:
          - onboarding
  mfa:
    origin: ${AUTH_MFA_ORIGIN:}
    receipt-issuer: ${AUTH_MFA_RECEIPT_ISSUER:mfa-service}
    receipt-public-jwk: ${AUTH_MFA_RECEIPT_PUBLIC_JWK:}
