spring:
  application:
    name: authentication-service
  mvc:
    log-request-details: false
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USER}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${AUTH_DB_POOL_SIZE}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        cache:
          use_second_level_cache: false
          use_query_cache: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${AUTH_REDIS_HOST}
      port: ${AUTH_REDIS_PORT}
      username: ${AUTH_REDIS_USER}
      password: ${AUTH_REDIS_PASSWORD}
      ssl:
        enabled: true

server:
  port: ${AUTH_SERVER_PORT:8443}
  tomcat:
    accesslog:
      enabled: false
  ssl:
    enabled: true
    key-store: ${AUTH_SERVER_KEYSTORE}
    key-store-password: ${AUTH_SERVER_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    client-auth: need
    trust-store: ${AUTH_SERVER_TRUSTSTORE}
    trust-store-password: ${AUTH_SERVER_TRUSTSTORE_PASSWORD}
    trust-store-type: PKCS12

auth:
  dpop:
    enabled: ${AUTH_DPOP_ENABLED:true}
    allowed-algorithms: ${AUTH_DPOP_ALLOWED_ALGORITHMS:ES256}
  password-flow:
    customer-policy-version: ${AUTH_CUSTOMER_POLICY_VERSION}
    credential-deadline-ms: ${AUTH_PASSWORD_CREDENTIAL_DEADLINE_MS}
    journey-deadline-ms: ${AUTH_PASSWORD_JOURNEY_DEADLINE_MS}
  native-session:
    lookup-key-version: ${AUTH_TOKEN_LOOKUP_KEY_VERSION}
    lookup-hmac-base64: ${AUTH_TOKEN_LOOKUP_HMAC_BASE64}
    nonce-validity-ms: ${AUTH_DPOP_NONCE_VALIDITY_MS}
    integration-activation-enabled: ${AUTH_INTEGRATION_ACTIVE_ENABLED:false}
  session-extension:
    # Read only when integration activation is on. No defaults for who may call and what counts.
    bff-workload-uri: ${AUTH_SESSION_EXTENSION_BFF_WORKLOAD_URI:}
    activity-routes: ${AUTH_SESSION_EXTENSION_ACTIVITY_ROUTES:}
    max-admission-age-ms: ${AUTH_SESSION_EXTENSION_MAX_ADMISSION_AGE_MS:30000}
    max-clock-skew-ms: ${AUTH_SESSION_EXTENSION_MAX_CLOCK_SKEW_MS:2000}
  authority:
    scope: ${AUTH_BANK_SCOPE}
  token-delivery:
    issuer: ${AUTH_TOKEN_DELIVERY_ISSUER}
    receipt-private-jwk: ${AUTH_TOKEN_RECEIPT_PRIVATE_JWK}
  ingress:
    external-origin: ${AUTH_EXTERNAL_ORIGIN}
    allowed-workload-uris: ${AUTH_ALLOWED_WORKLOAD_URIS}
  workload:
    tls:
      key-store: ${AUTH_WORKLOAD_KEYSTORE}
      key-store-password: ${AUTH_WORKLOAD_KEYSTORE_PASSWORD}
      trust-store: ${AUTH_WORKLOAD_TRUSTSTORE}
      trust-store-password: ${AUTH_WORKLOAD_TRUSTSTORE_PASSWORD}
      connect-timeout-ms: ${AUTH_WORKLOAD_CONNECT_TIMEOUT_MS}
  keycloak:
    private-client:
      token-audience: ${AUTH_KC_TOKEN_AUDIENCE}
      client-id: ${AUTH_KC_CLIENT_ID:authentication-service}
      authentication-method: ${AUTH_KC_CLIENT_AUTHENTICATION_METHOD:PRIVATE_KEY_JWT}
      client-secret: ${AUTH_KC_CLIENT_SECRET:}
      private-jwk: ${AUTH_KC_CLIENT_PRIVATE_JWK:}
      request-timeout-ms: ${AUTH_KC_REQUEST_TIMEOUT_MS}
    id-token-trust:
      issuer: ${AUTH_KC_ID_TOKEN_ISSUER}
      key-id: ${AUTH_KC_ID_TOKEN_KID}
      public-jwk: ${AUTH_KC_ID_TOKEN_PUBLIC_JWK}
    context-trust:
      issuer: ${AUTH_KC_CONTEXT_ISSUER}
      key-id: ${AUTH_KC_CONTEXT_KID}
      public-jwk: ${AUTH_KC_CONTEXT_PUBLIC_JWK}
  customer:
    status-max-age-ms: ${AUTH_CUSTOMER_STATUS_MAX_AGE_MS}
    origin: ${AUTH_CUSTOMER_ORIGIN}
    request-timeout-ms: ${AUTH_CUSTOMER_REQUEST_TIMEOUT_MS}
  trusted-device:
    restricted-session-ttl-seconds: ${AUTH_TRUSTED_DEVICE_RESTRICTED_SESSION_TTL_SECONDS:600}
    verify-max-attempts: ${AUTH_TRUSTED_DEVICE_VERIFY_MAX_ATTEMPTS:3}
    trust-lifetime-days: ${AUTH_TRUSTED_DEVICE_TRUST_LIFETIME_DAYS:90}
    # Bank policy, deliberately without a default.
    maximum-active-devices: ${AUTH_TRUSTED_DEVICE_MAXIMUM_ACTIVE_DEVICES:}
    trust-policy-version: ${AUTH_TRUSTED_DEVICE_TRUST_POLICY_VERSION:}
    server-key-wrapping:
      active-key-id: ${AUTH_TRUSTED_DEVICE_SERVER_KEY_ACTIVE_ID:}
      # One entry per wrapping key ID, e.g. AUTH_TRUSTED_DEVICE_SERVERKEYWRAPPING_KEYSBASE64_K1.
      # Retired IDs stay until no stored Ksrv is wrapped with them.
    bff-assertion:
      issuer: ${AUTH_TRUSTED_DEVICE_BFF_ISSUER:mobile-bff}
      key-id: ${AUTH_TRUSTED_DEVICE_BFF_KEY_ID:}
      public-jwk: ${AUTH_TRUSTED_DEVICE_BFF_PUBLIC_JWK:}
    mfa:
      origin: ${AUTH_MFA_ORIGIN:}
      request-timeout-ms: ${AUTH_MFA_REQUEST_TIMEOUT_MS:3000}
      receipt:
        issuer: ${AUTH_MFA_RECEIPT_ISSUER:}
        key-id: ${AUTH_MFA_RECEIPT_KEY_ID:}
        public-jwk: ${AUTH_MFA_RECEIPT_PUBLIC_JWK:}
  device-id:
    lookup-key-id: ${AUTH_DEVICE_ID_LOOKUP_KEY_ID:}
    lookup-key-base64: ${AUTH_DEVICE_ID_LOOKUP_KEY_BASE64:}
    encryption-key-id: ${AUTH_DEVICE_ID_ENCRYPTION_KEY_ID:}
    encryption-key-base64: ${AUTH_DEVICE_ID_ENCRYPTION_KEY_BASE64:}
